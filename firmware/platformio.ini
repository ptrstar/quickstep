; QuickStep firmware. Core logic lives in lib/quickstep (no Arduino dependency) and is tested natively.
;   pio run -e uno            build for the plotter (pio run -e uno -t upload to flash)
;   pio test -e native        run the core tests on this computer

[platformio]
default_envs = uno

[env]
; warnings for our code only, not the Arduino core
build_src_flags = -Wall -Wextra

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 250000

[env:native]
platform = native
build_flags = -Wall -Wextra -std=c++17 -DQS_NATIVE -DQS_REPO_ROOT=\"$PROJECT_DIR/..\" -DARDUINOJSON_STRING_LENGTH_SIZE=4
lib_deps = bblanchon/ArduinoJson@^7
test_build_src = no
